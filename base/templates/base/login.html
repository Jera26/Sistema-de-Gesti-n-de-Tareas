{% extends 'base/main.html' %}
{% block content %}

<div class="header-bar">
    <h1>Iniciar sesión</h1>
</div>
<div class="card-body">
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <input class="button" type="submit" value="Iniciar sesión">
    </form>

    <p>¿No tienes una cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
</div>
{% endblock content %}
