{% extends 'base/main.html' %}
{% block content %}
<div class="header-bar">
    <h1>Registro</h1>
</div>
<div class="card-body">
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <input style="margin-top: 10px;" class="button" type="submit" value="Registrarse">
    </form>

    <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock content %}
