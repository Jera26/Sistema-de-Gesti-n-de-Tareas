{% extends 'base/main.html' %}
{% block content %}

<div class="header-bar">
    <a href="{% url 'tasks' %}">&#8592; Volver</a>
</div>

        {% csrf_token %}
        <p>¿Seguro que quieres eliminar esta tarea? <strong>{{task}}</strong></p>
        <input class="button" type="submit" value="Eliminar">
    </form>

</div>

{% endblock content %}
